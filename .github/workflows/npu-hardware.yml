name: XDNA1 hardware acceptance

on:
  workflow_dispatch:
    inputs:
      completions:
        description: "Number of soak-test completions"
        default: "1000"
        required: true

permissions:
  contents: read

concurrency:
  group: xdna1-hardware
  cancel-in-progress: false

jobs:
  hawk-point:
    runs-on: [self-hosted, linux, x64, xdna1, hawk-point]
    timeout-minutes: 360
    env:
      GOMAXPROCS: "8"
      MKL_NUM_THREADS: "8"
      NUMEXPR_NUM_THREADS: "8"
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure pinned hardware toolchain
        run: ./scripts/configure-hardware-runner.sh
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify fresh host prerequisites
        run: ./ollama-xdna/scripts/verify-system.sh
      - name: Verify checked-in AIE probe artifacts
        run: |
          cd ollama-xdna/backend/artifacts
          sha256sum --check SHA256SUMS
      - name: Verify compatible hardware capabilities
        run: |
          python scripts/verify_hardware_versions.py \
            --report "$RUNNER_TEMP/hardware-versions.json"
      - name: Download pinned sources and convert every supported model
        run: |
          python scripts/prepare_model.py \
            --all \
            --models-dir "$RUNNER_TEMP/hawkpoint-models"
      - name: Native token agreement
        env:
          HAWKPOINT_MODEL_DIR: ${{ runner.temp }}/hawkpoint-models/SmolLM2-135M-Instruct-xdna1-w8a16
        run: |
          python npu_llm/tests/test_model_runtime.py
          python npu_llm/tests/validate_chat_npu.py
      - name: Qwen component and 32-token agreement gate
        env:
          HAWKPOINT_QWEN_MODEL_DIR: ${{ runner.temp }}/hawkpoint-models/Qwen2.5-0.5B-Instruct-xdna1-w8a16
        run: |
          python npu_llm/tests/test_qwen_components_npu.py
          python npu_llm/tests/validate_qwen_tokens.py \
            "$HAWKPOINT_QWEN_MODEL_DIR" \
            --tokens 32 \
            --report "$RUNNER_TEMP/qwen-token-agreement.json"
          python npu_llm/tests/benchmark_qwen_fused.py \
            "$HAWKPOINT_QWEN_MODEL_DIR" \
            --positions 32 \
            --report "$RUNNER_TEMP/qwen-fused-benchmark.json"
      - name: Model-switch stress and long-run endurance soak
        env:
          HAWKPOINT_SOAK_COMPLETIONS: ${{ inputs.completions || '1000' }}
          HAWKPOINT_SOAK_RUN_LENGTH: "250"
          HAWKPOINT_SWITCH_COUNT: "100"
          HAWKPOINT_API_KEY: hardware-ci-ephemeral-key
          HAWKPOINT_SOAK_REPORT: ${{ runner.temp }}/hawkpoint-soak-report.json
          HAWKPOINT_SWITCH_REPORT: ${{ runner.temp }}/hawkpoint-switch-stress-report.json
          HAWKPOINT_API_LOG: ${{ runner.temp }}/hawkpoint-api.log
          HAWKPOINT_EXPECTED_TOKENS: ${{ runner.temp }}/expected-token-ids.json
        run: |
          python tests/build_token_references.py \
            "$RUNNER_TEMP/hawkpoint-models" \
            --output "$HAWKPOINT_EXPECTED_TOKENS"
          python npu_llm/api_server.py \
            --models-dir "$RUNNER_TEMP/hawkpoint-models" \
            --api-key "$HAWKPOINT_API_KEY" \
            --rate-limit-per-minute 0 \
            >"$RUNNER_TEMP/hawkpoint-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8000/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ready >/dev/null
          HAWKPOINT_API_PID="$api_pid" python tests/switch_stress_api.py
          HAWKPOINT_API_PID="$api_pid" python tests/soak_api.py
      - name: Build patched Ollama without installing
        run: |
          ./ollama-xdna/scripts/build-and-install.sh \
            --backend "${OLLAMA_XDNA_GPU_BACKEND:-cpu}" \
            --jobs 8 \
            --no-install
      - name: Verify rollback script syntax
        run: bash -n ollama-xdna/scripts/rollback.sh
      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: xdna1-hardware-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/hawkpoint-soak-report.json
            ${{ runner.temp }}/hawkpoint-switch-stress-report.json
            ${{ runner.temp }}/qwen-token-agreement.json
            ${{ runner.temp }}/qwen-fused-benchmark.json
            ${{ runner.temp }}/expected-token-ids.json
            ${{ runner.temp }}/hardware-versions.json
            ${{ runner.temp }}/hawkpoint-api.log

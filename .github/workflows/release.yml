name: Gated release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  hosted-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m compileall -q .
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: |
          python npu_llm/tests/test_converter.py
          python npu_llm/tests/test_model_integrity.py
          python tests/test_api_server.py

  hosted-ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: |
          bash -n ollama-xdna/scripts/*.sh
          shellcheck ollama-xdna/scripts/*.sh
          cd ollama-xdna/backend/artifacts
          sha256sum --check SHA256SUMS
      - name: Apply patch and run upstream Go tests
        run: |
          git clone --quiet --filter=blob:none --branch v0.32.5 \
            https://github.com/ollama/ollama.git /tmp/ollama
          git -C /tmp/ollama apply \
            "$GITHUB_WORKSPACE/ollama-xdna/patches/ollama-v0.32.5-xdna.patch"
          cd /tmp/ollama
          GOMAXPROCS=8 go test -p 8 ./api ./cmd ./discover ./llm ./server

  hawk-point:
    needs: [hosted-protocol, hosted-ollama]
    runs-on: [self-hosted, linux, x64, xdna1, hawk-point]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure pinned hardware toolchain
        run: ./scripts/configure-hardware-runner.sh
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ./ollama-xdna/scripts/verify-system.sh
      - name: Fresh pinned conversion
        run: |
          python scripts/prepare_model.py \
            --all \
            --models-dir "$RUNNER_TEMP/hawkpoint-models"
      - name: SmolLM and Qwen correctness gates
        env:
          HAWKPOINT_MODEL_DIR: ${{ runner.temp }}/hawkpoint-models/SmolLM2-135M-Instruct-xdna1-w8a16
          HAWKPOINT_QWEN_MODEL_DIR: ${{ runner.temp }}/hawkpoint-models/Qwen2.5-0.5B-Instruct-xdna1-w8a16
        run: |
          python npu_llm/tests/test_model_runtime.py
          python npu_llm/tests/validate_chat_npu.py
          python npu_llm/tests/test_qwen_components_npu.py
          python npu_llm/tests/validate_qwen_tokens.py \
            "$HAWKPOINT_QWEN_MODEL_DIR" \
            --tokens 32 \
            --report "$RUNNER_TEMP/qwen-token-agreement.json"
          python npu_llm/tests/benchmark_qwen_fused.py \
            "$HAWKPOINT_QWEN_MODEL_DIR" \
            --positions 32
      - name: Start API and run 1,000-completion soak
        env:
          HAWKPOINT_API_KEY: release-hardware-ephemeral-key
          HAWKPOINT_SOAK_COMPLETIONS: "1000"
          HAWKPOINT_SOAK_REPORT: ${{ runner.temp }}/hawkpoint-soak-report.json
          HAWKPOINT_API_LOG: ${{ runner.temp }}/hawkpoint-api.log
          HAWKPOINT_EXPECTED_TOKENS: ${{ runner.temp }}/expected-token-ids.json
        run: |
          python tests/build_token_references.py \
            "$RUNNER_TEMP/hawkpoint-models" \
            --output "$HAWKPOINT_EXPECTED_TOKENS"
          python npu_llm/api_server.py \
            --models-dir "$RUNNER_TEMP/hawkpoint-models" \
            --api-key "$HAWKPOINT_API_KEY" \
            --rate-limit-per-minute 0 \
            >"$HAWKPOINT_API_LOG" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8000/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ready >/dev/null
          HAWKPOINT_API_PID="$api_pid" python tests/soak_api.py
      - name: Ollama build, install, inference, and rollback gate
        run: |
          backend="${OLLAMA_XDNA_GPU_BACKEND:-cuda_v13}"
          ./ollama-xdna/scripts/build-and-install.sh \
            --backend "$backend" \
            --jobs 8 \
            --build-root "$RUNNER_TEMP/ollama-release-build" \
            --no-install
          python tests/benchmark_ollama_matrix.py \
            --ollama-bin "$RUNNER_TEMP/ollama-release-build/stage/bin/ollama" \
            --xdna-dir "$RUNNER_TEMP/ollama-release-build/stage/lib/ollama/xdna" \
            --models-dir "$RUNNER_TEMP/ollama-benchmark-models" \
            --output-dir "$RUNNER_TEMP/ollama-placement-matrix" \
            --gpu-library "$backend" \
            --requests 1000 \
            --tokens 16
          installed=0
          rollback() {
            if [[ "$installed" -eq 1 ]]; then
              sudo /usr/local/lib/ollama/xdna/rollback.sh
            fi
          }
          trap rollback EXIT
          sudo ./ollama-xdna/scripts/install-stage.sh \
            "$RUNNER_TEMP/ollama-release-build/stage" \
            0.32.5 \
            "$backend" \
            0
          installed=1
          curl -fsS http://127.0.0.1:11434/api/version |
            jq -e '.version | endswith("-xdna")'
          timeout 10m ollama pull qwen2.5:0.5b
          timeout 5m ollama run qwen2.5:0.5b "Reply with exactly OK."
          journalctl -u ollama --since "-10 minutes" --no-pager |
            grep -Eq "XDNA (dense Qwen|expert) offload count: [1-9]"
          sudo /usr/local/lib/ollama/xdna/rollback.sh
          installed=0
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null
      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: xdna1-release-evidence-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hawkpoint-soak-report.json
            ${{ runner.temp }}/qwen-token-agreement.json
            ${{ runner.temp }}/expected-token-ids.json
            ${{ runner.temp }}/hawkpoint-api.log
            ${{ runner.temp }}/ollama-placement-matrix/

  publish:
    needs: hawk-point
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download gated hardware evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: xdna1-release-evidence-${{ github.ref_name }}
          path: hardware-evidence
      - name: Build source bundle and checksums
        run: |
          git archive --format=tar.gz \
            --prefix="hawkpoint-npu-llm-${GITHUB_REF_NAME}/" \
            -o "hawkpoint-npu-llm-${GITHUB_REF_NAME}.tar.gz" \
            "$GITHUB_SHA"
          tar -czf "hardware-evidence-${GITHUB_REF_NAME}.tar.gz" \
            -C hardware-evidence .
          sha256sum \
            "hawkpoint-npu-llm-${GITHUB_REF_NAME}.tar.gz" \
            "hardware-evidence-${GITHUB_REF_NAME}.tar.gz" \
            > SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: hawkpoint-npu-llm.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign checksums
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS
      - name: Attest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: hawkpoint-npu-llm-${{ github.ref_name }}.tar.gz
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            hawkpoint-npu-llm-${{ github.ref_name }}.tar.gz
            hardware-evidence-${{ github.ref_name }}.tar.gz
            hawkpoint-npu-llm.spdx.json
            SHA256SUMS
            SHA256SUMS.sigstore.json
            hardware-evidence/**

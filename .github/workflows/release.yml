name: Gated release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Hardware test budget (manual runs never publish)"
        type: choice
        options: [quick, endurance]
        default: quick
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  hosted-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m compileall -q .
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: |
          python npu_llm/tests/test_converter.py
          python npu_llm/tests/test_model_integrity.py
          python tests/test_api_server.py
          python tests/test_release_gates.py

  hosted-ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: |
          bash -n ollama-xdna/scripts/*.sh
          shellcheck ollama-xdna/scripts/*.sh
          cd ollama-xdna/backend/artifacts
          sha256sum --check SHA256SUMS
      - name: Apply patch and run upstream Go tests
        run: |
          ollama_tag="$(jq -er '.ollama.source_tag' release-pins.json)"
          ollama_commit="$(jq -er '.ollama.source_commit' release-pins.json)"
          patch_file="$GITHUB_WORKSPACE/ollama-xdna/patches/ollama-${ollama_tag}-xdna.patch"
          git clone --quiet --filter=blob:none --branch "$ollama_tag" \
            https://github.com/ollama/ollama.git /tmp/ollama
          test "$(git -C /tmp/ollama rev-parse HEAD)" = \
            "$ollama_commit"
          git -C /tmp/ollama apply --check "$patch_file"
          git -C /tmp/ollama apply \
            "$patch_file"
          cd /tmp/ollama
          GOMAXPROCS=8 go test -p 8 ./api ./cmd ./discover ./llm ./server

  hosted-colibri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: |
          bash -n colibri-xdna/scripts/*.sh
          shellcheck colibri-xdna/scripts/*.sh
      - name: Apply patch to pinned Colibri source
        run: |
          commit="$(jq -er '.colibri.source_commit' release-pins.json)"
          repository="$(jq -er '.colibri.source_repository' release-pins.json)"
          git clone --quiet --filter=blob:none "$repository" /tmp/colibri
          git -C /tmp/colibri checkout --quiet "$commit"
          git -C /tmp/colibri apply --check \
            "$GITHUB_WORKSPACE/colibri-xdna/patches/colibri-a8f2ca6-xdna.patch"
          git -C /tmp/colibri apply \
            "$GITHUB_WORKSPACE/colibri-xdna/patches/colibri-a8f2ca6-xdna.patch"
          cp colibri-xdna/backend/backend_xdna.cpp /tmp/colibri/c/backend_xdna.cpp
          make -C /tmp/colibri/c -n colibri XDNA=1 | grep -q backend_xdna.cpp

  hawk-point:
    needs: [hosted-protocol, hosted-ollama, hosted-colibri]
    runs-on: [self-hosted, linux, x64, xdna1, hawk-point]
    timeout-minutes: 1440
    env:
      HAWKPOINT_SOAK_COMPLETIONS: ${{ inputs.profile == 'endurance' && '1000' || '100' }}
      HAWKPOINT_SOAK_RUN_LENGTH: ${{ inputs.profile == 'endurance' && '250' || '25' }}
      HAWKPOINT_OLLAMA_REQUESTS: ${{ inputs.profile == 'endurance' && '1000' || '25' }}
      GOMAXPROCS: "8"
      MKL_NUM_THREADS: "8"
      NUMEXPR_NUM_THREADS: "8"
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure pinned hardware toolchain
        run: ./scripts/configure-hardware-runner.sh
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ./ollama-xdna/scripts/verify-system.sh
      - name: Verify checked-in AIE probe artifacts
        run: |
          cd ollama-xdna/backend/artifacts
          sha256sum --check SHA256SUMS
      - name: Build Colibri and verify its direct C/XDNA path
        run: |
          ./colibri-xdna/scripts/build.sh \
            --build-root "$RUNNER_TEMP/colibri-release-build" \
            --jobs 8 \
            --test-npu
      - name: Certify release hardware stack and capture compatibility report
        run: |
          python scripts/verify_hardware_versions.py \
            --strict-release \
            --report "$RUNNER_TEMP/hardware-versions.json"
      - name: Verify dedicated runner install privileges
        run: sudo -n true
      - name: Fresh pinned conversion
        run: |
          python scripts/prepare_model.py \
            --all \
            --models-dir "$RUNNER_TEMP/hawkpoint-models"
      - name: SmolLM and Qwen correctness gates
        env:
          HAWKPOINT_MODEL_DIR: ${{ runner.temp }}/hawkpoint-models/SmolLM2-135M-Instruct-xdna1-w8a16
          HAWKPOINT_QWEN_MODEL_DIR: ${{ runner.temp }}/hawkpoint-models/Qwen2.5-0.5B-Instruct-xdna1-w8a16
        run: |
          python npu_llm/tests/test_model_runtime.py
          python npu_llm/tests/validate_chat_npu.py
          python npu_llm/tests/test_qwen_components_npu.py
          python npu_llm/tests/validate_qwen_tokens.py \
            "$HAWKPOINT_QWEN_MODEL_DIR" \
            --tokens 32 \
            --report "$RUNNER_TEMP/qwen-token-agreement.json"
          python npu_llm/tests/benchmark_qwen_fused.py \
            "$HAWKPOINT_QWEN_MODEL_DIR" \
            --positions 32 \
            --report "$RUNNER_TEMP/qwen-fused-benchmark.json"
      - name: Start API, model-switch stress, and endurance soak
        env:
          HAWKPOINT_API_KEY: release-hardware-ephemeral-key
          HAWKPOINT_SWITCH_COUNT: "100"
          HAWKPOINT_SOAK_REPORT: ${{ runner.temp }}/hawkpoint-soak-report.json
          HAWKPOINT_SWITCH_REPORT: ${{ runner.temp }}/hawkpoint-switch-stress-report.json
          HAWKPOINT_API_LOG: ${{ runner.temp }}/hawkpoint-api.log
          HAWKPOINT_EXPECTED_TOKENS: ${{ runner.temp }}/expected-token-ids.json
        run: |
          python tests/build_token_references.py \
            "$RUNNER_TEMP/hawkpoint-models" \
            --output "$HAWKPOINT_EXPECTED_TOKENS"
          python npu_llm/api_server.py \
            --models-dir "$RUNNER_TEMP/hawkpoint-models" \
            --api-key "$HAWKPOINT_API_KEY" \
            --rate-limit-per-minute 0 \
            >"$HAWKPOINT_API_LOG" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8000/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ready >/dev/null
          HAWKPOINT_API_PID="$api_pid" python tests/switch_stress_api.py
          HAWKPOINT_API_PID="$api_pid" python tests/soak_api.py
      - name: Ollama build, install, inference, and rollback gate
        run: |
          ollama_tag="$(jq -er '.ollama.source_tag' release-pins.json)"
          backend="${OLLAMA_XDNA_GPU_BACKEND:-cuda_v13}"
          model="$(jq -r '.ollama.model' release-pins.json)"
          model_manifest="$(
            jq -r '.ollama.model_manifest_sha256' release-pins.json
          )"
          ./ollama-xdna/scripts/build-and-install.sh \
            --tag "$ollama_tag" \
            --backend "$backend" \
            --jobs 8 \
            --build-root "$RUNNER_TEMP/ollama-release-build" \
            --no-install
          python tests/benchmark_ollama_matrix.py \
            --ollama-bin "$RUNNER_TEMP/ollama-release-build/stage/bin/ollama" \
            --xdna-dir "$RUNNER_TEMP/ollama-release-build/stage/lib/ollama/xdna" \
            --models-dir "$RUNNER_TEMP/ollama-benchmark-models" \
            --output-dir "$RUNNER_TEMP/ollama-placement-matrix" \
            --model "$model" \
            --model-manifest-sha256 "$model_manifest" \
            --gpu-library "$backend" \
            --requests "$HAWKPOINT_OLLAMA_REQUESTS" \
            --tokens 16
          installed=0
          rollback() {
            if [[ "$installed" -eq 1 ]]; then
              sudo /usr/local/lib/ollama/xdna/rollback.sh
            fi
          }
          trap rollback EXIT
          sudo ./ollama-xdna/scripts/install-stage.sh \
            "$RUNNER_TEMP/ollama-release-build/stage" \
            "${ollama_tag#v}" \
            "$backend" \
            0
          installed=1
          curl -fsS http://127.0.0.1:11434/api/version |
            jq -e '.version | endswith("-xdna")'
          timeout 10m ollama pull "$model"
          python tests/verify_ollama_manifest.py \
            --models-dir /var/lib/ollama/.ollama/models \
            --model "$model" \
            --sha256 "$model_manifest" \
            --report "$RUNNER_TEMP/ollama-system-manifest.json"
          timeout 5m ollama run "$model" "Reply with exactly OK."
          journalctl -u ollama --since "-10 minutes" --no-pager |
            grep -Eq "XDNA (dense Qwen|expert) offload count: [1-9]"
          sudo /usr/local/lib/ollama/xdna/rollback.sh
          installed=0
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null
      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xdna1-release-evidence-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hawkpoint-soak-report.json
            ${{ runner.temp }}/hawkpoint-switch-stress-report.json
            ${{ runner.temp }}/qwen-token-agreement.json
            ${{ runner.temp }}/qwen-fused-benchmark.json
            ${{ runner.temp }}/expected-token-ids.json
            ${{ runner.temp }}/hardware-versions.json
            ${{ runner.temp }}/hawkpoint-api.log
            ${{ runner.temp }}/ollama-system-manifest.json
            ${{ runner.temp }}/ollama-placement-matrix/

  publish:
    if: github.event_name == 'push'
    needs: hawk-point
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download gated hardware evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xdna1-release-evidence-${{ github.ref_name }}
          path: hardware-evidence
      - name: Build source bundle and checksums
        run: |
          git archive --format=tar.gz \
            --prefix="hawkpoint-npu-llm-${GITHUB_REF_NAME}/" \
            -o "hawkpoint-npu-llm-${GITHUB_REF_NAME}.tar.gz" \
            "$GITHUB_SHA"
          tar -czf "hardware-evidence-${GITHUB_REF_NAME}.tar.gz" \
            -C hardware-evidence .
          sha256sum \
            "hawkpoint-npu-llm-${GITHUB_REF_NAME}.tar.gz" \
            "hardware-evidence-${GITHUB_REF_NAME}.tar.gz" \
            > SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: hawkpoint-npu-llm.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign checksums
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: hawkpoint-npu-llm-${{ github.ref_name }}.tar.gz
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body: "Hardware evidence uses the quick profile: 100 native and 25 requests per Ollama placement. This release does not certify long-duration endurance."
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            hawkpoint-npu-llm-${{ github.ref_name }}.tar.gz
            hardware-evidence-${{ github.ref_name }}.tar.gz
            hawkpoint-npu-llm.spdx.json
            SHA256SUMS
            SHA256SUMS.sigstore.json
            hardware-evidence/**

name: Release integrity

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build source bundle and checksums
        run: |
          git archive --format=tar.gz \
            --prefix="hawkpoint-npu-llm-${GITHUB_REF_NAME}/" \
            -o "hawkpoint-npu-llm-${GITHUB_REF_NAME}.tar.gz" \
            "$GITHUB_SHA"
          sha256sum "hawkpoint-npu-llm-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: hawkpoint-npu-llm.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign checksums with keyless Sigstore identity
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS
      - name: Attest source bundle provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: hawkpoint-npu-llm-${{ github.ref_name }}.tar.gz
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            hawkpoint-npu-llm-${{ github.ref_name }}.tar.gz
            hawkpoint-npu-llm.spdx.json
            SHA256SUMS
            SHA256SUMS.sigstore.json

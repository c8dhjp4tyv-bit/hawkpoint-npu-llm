name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test converter
        run: |
          python npu_llm/tests/test_converter.py
          python npu_llm/tests/test_model_integrity.py
      - name: Test OpenAI-compatible protocol
        run: |
          python tests/test_api_server.py
          python tests/test_chat_context.py
          python tests/test_release_gates.py
      - name: Both execution modes resolve internal imports
        run: |
          # The server must start the same way as a script and as a module.
          python npu_llm/api_server.py --help >/dev/null
          python -m npu_llm.api_server --help >/dev/null
          python -c "import npu_llm.api_server, npu_llm.model_catalog"
      - name: Build the distribution
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"

  ollama-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install static-analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          bash -n ollama-xdna/scripts/*.sh
          shellcheck ollama-xdna/scripts/*.sh
      - name: Verify prebuilt AIE artifacts
        run: |
          cd ollama-xdna/backend/artifacts
          sha256sum --check SHA256SUMS
      - name: Verify the patch against supported Ollama
        run: |
          git clone --quiet --filter=blob:none --branch v0.32.5 \
            https://github.com/ollama/ollama.git /tmp/ollama
          test "$(git -C /tmp/ollama rev-parse HEAD)" = \
            "eec8e0b9458b8a01be0c216a9cc53eefde24ef50"
          git -C /tmp/ollama apply --check \
            "$GITHUB_WORKSPACE/ollama-xdna/patches/ollama-v0.32.5-xdna.patch"
          git -C /tmp/ollama apply \
            "$GITHUB_WORKSPACE/ollama-xdna/patches/ollama-v0.32.5-xdna.patch"
          cd /tmp/ollama
          go test ./api ./cmd ./discover ./llm ./server

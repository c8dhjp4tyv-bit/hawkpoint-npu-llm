name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test converter
        run: |
          python npu_llm/tests/test_converter.py
          cd npu_llm
          python tests/test_model_integrity.py
      - name: Test host-side sampling, tokenizer, and the decode loop
        run: |
          python npu_llm/tests/test_sampling.py
          python npu_llm/tests/test_stopping.py
          python npu_llm/tests/test_tokenizer.py
          python npu_llm/tests/test_decode_loop.py
          python npu_llm/tests/test_cpu_backend.py
      - name: Test OpenAI-compatible protocol
        run: |
          python tests/test_api_server.py
          python tests/test_release_gates.py

  ollama-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install static-analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          bash -n ollama-xdna/scripts/*.sh
          shellcheck ollama-xdna/scripts/*.sh
      - name: Verify prebuilt AIE artifacts
        run: |
          cd ollama-xdna/backend/artifacts
          sha256sum --check SHA256SUMS
      - name: Verify the patch against supported Ollama
        run: |
          ollama_tag="$(jq -er '.ollama.source_tag' release-pins.json)"
          ollama_commit="$(jq -er '.ollama.source_commit' release-pins.json)"
          patch_file="$GITHUB_WORKSPACE/ollama-xdna/patches/ollama-${ollama_tag}-xdna.patch"
          git clone --quiet --filter=blob:none --branch "$ollama_tag" \
            https://github.com/ollama/ollama.git /tmp/ollama
          test "$(git -C /tmp/ollama rev-parse HEAD)" = \
            "$ollama_commit"
          git -C /tmp/ollama apply --check \
            "$patch_file"
          git -C /tmp/ollama apply \
            "$patch_file"
          cd /tmp/ollama
          go test ./api ./cmd ./discover ./llm ./server

  colibri-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install static-analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check integration scripts
        run: |
          bash -n colibri-xdna/scripts/*.sh
          shellcheck colibri-xdna/scripts/*.sh
      - name: Verify patch against pinned Colibri
        run: |
          commit="$(jq -er '.colibri.source_commit' release-pins.json)"
          repository="$(jq -er '.colibri.source_repository' release-pins.json)"
          git clone --quiet --filter=blob:none "$repository" /tmp/colibri
          git -C /tmp/colibri checkout --quiet "$commit"
          git -C /tmp/colibri apply --check \
            "$GITHUB_WORKSPACE/colibri-xdna/patches/colibri-a8f2ca6-xdna.patch"
          git -C /tmp/colibri apply \
            "$GITHUB_WORKSPACE/colibri-xdna/patches/colibri-a8f2ca6-xdna.patch"
          cp colibri-xdna/backend/backend_xdna.cpp /tmp/colibri/c/backend_xdna.cpp
          make -C /tmp/colibri/c -n colibri XDNA=1 | grep -q backend_xdna.cpp
